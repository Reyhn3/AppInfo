# Build and test for continuous integration


name: Build and Test


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: >
        dotnet build \
          --no-restore \
          --configuration Release

    - name: Test
      run: >
        dotnet test \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --logger trx \
          --results-directory "TestResults-${{ github.event.inputs.version }}"

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: ${{ always() }}  # Always run this step to publish test results when there are test failures
      with:
        name: test-results.${{ github.event.inputs.version }}.zip
        path: TestResults-${{ github.event.inputs.version }}
