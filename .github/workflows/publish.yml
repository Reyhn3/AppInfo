# Build, test, pack NuGet then publish it to NuGet.org.


name: Publish NuGet


on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        default: '0.0.0-pre-0'
        description: "Version to publish (without 'v' prefix)"
      dry-run:
        required: true
        type: boolean
        default: true
        description: "Dry run (doesn't actually publish anything)"


jobs:
  zip:
    name: Zip Source Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
#        with:
#          ref: "v${{ github.event.inputs.version }}"

      - name: Upload source code to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AppInfo-${{ github.event.inputs.version }}-source.zip
          path: .

  pack:
    name: Pack NuGet Packages
    runs-on: ubuntu-latest

    outputs:
      package-artifact: ${{ steps.artifact-upload-package.outputs.artifact-id }}
      symbols-artifact: ${{ steps.artifact-upload-symbols.outputs.artifact-id }}

    steps:
      - name: Version
        run: echo "Using version ${{ github.event.inputs.version }}"

      - name: Checkout
        uses: actions/checkout@v7
#        with:
#          ref: "v${{ github.event.inputs.version }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: >
          dotnet build \
            --no-restore \
            --configuration Release \
            -p:Version="${{ github.event.inputs.version }}"

      - name: Test
        run: >
          dotnet test \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger trx \
            --results-directory "TestResults-${{ github.event.inputs.version }}"

      - name: Create package
        run: >
          dotnet pack \
            "./src/AppInfo/AppInfo.csproj" \
            --nologo \
            --no-build \
            --include-symbols \
            --configuration Release \
            -p:Version="${{ github.event.inputs.version }}" \
            --output "packages"

      - name: Upload NuGet to artifacts
        id: "artifact-upload-package"
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: "packages/AppInfo.${{ github.event.inputs.version }}.nupkg"
          archive: false

      - name: Upload symbols to artifacts
        id: "artifact-upload-symbols"
        uses: actions/upload-artifact@v7
        with:
          name: symbols
          path: "packages/AppInfo.${{ github.event.inputs.version }}.snupkg"
          archive: false

  publish:
    name: Publish NuGet Packages
    needs: pack
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
      contents: read

    env:
      PACKAGE_ARTIFACT: ${{ needs.pack.outputs.package-artifact }}
      SYMBOLS_ARTIFACT: ${{ needs.pack.outputs.symbols-artifact }}

    steps:
      - name: Download package from artifacts
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.PACKAGE_ARTIFACT }}
          path: "packages"

      - name: Download symbols from artifacts
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.SYMBOLS_ARTIFACT }}
          path: "packages"

      - name: NuGet login  # (OIDC → temp API key)
        uses: NuGet/login@v1  # Get a short-lived NuGet API key
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        if: ${{ !inputs.dry-run }}
        run: >
          dotnet nuget push \
            "packages/AppInfo.${{ github.event.inputs.version }}.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
