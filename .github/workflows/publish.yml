name: Publish NuGet


on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Version to publish"
      dry-run:
        required: true
        type: boolean
        description: "Dry run (doesn't actually publish anything)"


jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version
        run: echo "vars ${{ vars.VERSION }} env ${{ env.VERSION }} input ${{ github.event.inputs.version }}"

      - name: List
        run: ls -alR


  build:
    name: Build and Test
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ vars.VERSION }}

  zip:
    name: Zip Source Code
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Zip Source Code
        run: |
          mkdir source
          cp -r AppInfo/* source/
          zip -r artifacts/AppInfo-${{ vars.VERSION }}-source.zip source

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppInfo-${{ vars.VERSION }}
          path: artifacts/

  pack:
    name: Pack NuGet Packages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    steps:
      - name: Version
        run: echo "Using version ${{ vars.VERSION }}"

      - name: List
        run: ls -alR

      - name: Create package
        run: dotnet pack "./src/AppInfo/AppInfo.csproj" --nologo --no-build --include-symbols --configuration Release -p:Version="${{ vars.VERSION }}" --output "artifacts"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: "artifacts"

  publish:
    name: Publish NuGet Packages
    needs: pack

    runs-on: ubuntu-latest

    if: ${{ !inputs.dry-run }}

    steps:
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1  # Get a short-lived NuGet API key
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

#      - name: Publish to NuGet
#        run: dotnet nuget push artifacts/AppInfo.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
